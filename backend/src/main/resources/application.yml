server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: melia-hotel-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your_hotel_email@gmail.com}
    password: ${MAIL_PASSWORD:your_app_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    serialization:
      fail-on-empty-beans: false

# Cấu hình Token JWT
app:
  jwt:
    secret: ${JWT_SECRET:9a4f2c8d3b7a1e6f5c8d0e2b4a6c8e1f3a5b7d9e1f3a5b7d9e1f3a5b7d9e1f3a}
    expiration-ms: 86400000 # 24 giờ (milliseconds)

# Cấu hình Cổng thanh toán VNPay Sandbox
vnpay:
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: http://localhost:8080/api/v1/payments/vnpay-callback
  tmn-code: ${VNPAY_TMN_CODE:MELIAHN01}
  hash-secret: ${VNPAY_HASH_SECRET:XNCVKUEVHGFLTBYDFKJLSJFDHLKJSDHF}
  api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

# Cấu hình Swagger OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
